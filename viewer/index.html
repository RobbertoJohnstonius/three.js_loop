  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: 'Courier New', monospace; color: #ccd; }
  #c { display: block; width: 100vw; height: 100vh; }

  #overlay {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(10,10,24,0.82); border: 1px solid #334466;
    border-radius: 6px; padding: 12px 16px; min-width: 240px;
    font-size: 12px; line-height: 1.7;
    pointer-events: none;
  }
  #overlay .label { color: #7788aa; }
  #overlay .val   { color: #eef; }
  #overlay .pass  { color: #4dfa90; font-weight: bold; }
  #overlay .fail  { color: #fa6060; }
  #overlay .warn  { color: #facc60; }

  #asset-name {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,24,0.75); border: 1px solid #334466;
    border-radius: 4px; padding: 6px 18px; font-size: 13px; color: #99b;
    pointer-events: none;
  }

  #reload-flash {
    position: fixed; top: 16px; right: 16px;
    background: #4dfa9030; border: 1px solid #4dfa90;
    border-radius: 4px; padding: 4px 12px; font-size: 11px; color: #4dfa90;
    opacity: 0; transition: opacity 0.4s;
    pointer-events: none;
  }
  #reload-flash.show { opacity: 1; }

  #help {
    position: fixed; bottom: 16px; right: 16px;
    font-size: 10px; color: #445; line-height: 1.6;
    pointer-events: none;
  }

  /* ── Asset switcher ─────────────────────────────────────── */
  #switcher {
    position: fixed; top: 16px; right: 16px;
    background: rgba(10,10,24,0.82); border: 1px solid #334466;
    border-radius: 6px; padding: 8px 10px; font-size: 11px;
    max-height: 80vh; overflow-y: auto; min-width: 140px;
  }
  #switcher .sw-group { margin-bottom: 8px; }
  #switcher .sw-group:last-child { margin-bottom: 0; }
  #switcher .sw-name {
    color: #7788aa; font-size: 10px; letter-spacing: 0.05em;
    text-transform: uppercase; margin-bottom: 4px;
  }
  #switcher .sw-versions { display: flex; flex-wrap: wrap; gap: 4px; }
  #switcher .sw-btn {
    background: rgba(51,68,102,0.4); border: 1px solid #334466;
    border-radius: 3px; padding: 2px 7px; color: #99b; cursor: pointer;
    font-family: 'Courier New', monospace; font-size: 11px;

  #switcher .sw-btn.dist   { color: #4dfa90; border-color: #2a6644; }

  /* ── Style switcher ─────────────────────────────────────── */
  #style-bar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,24,0.82); border: 1px solid #334466;
    border-radius: 6px; padding: 4px 6px;
    display: flex; gap: 4px;
  }
  #style-bar .st-btn {
    background: rgba(51,68,102,0.4); border: 1px solid #334466;
    border-radius: 3px; padding: 3px 10px; color: #99b; cursor: pointer;
    font-family: 'Courier New', monospace; font-size: 11px;
    transition: background 0.15s, color 0.15s;
  }
  #style-bar .st-btn:hover  { background: rgba(77,102,153,0.5); color: #eef; }
  #style-bar .st-btn.active { background: #334466; color: #fff; border-color: #556688; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Constants matching render_scene.mjs ───────────────────────────────────────
const BG_COLOR      = 0x1a1a2e;
const SUN_COLOR     = 0xfff5e0;
const SUN_INTENSITY = 2.2;
const FILL_COLOR    = 0x4466cc;
const FILL_INTENSITY = 0.25;
const AMB_COLOR     = 0x8899bb;
const AMB_INTENSITY = 0.20;
const PASS_THRESHOLD = 0.92;

// ── Renderer + scene setup ────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(BG_COLOR);

const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
camera.position.set(2.5, 2.0, 2.5);
camera.lookAt(0, 0.5, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Lighting — identical to render_scene.mjs
const sun = new THREE.DirectionalLight(SUN_COLOR, SUN_INTENSITY);
sun.position.set(5, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const fill = new THREE.DirectionalLight(FILL_COLOR, FILL_INTENSITY);
fill.position.set(-4, 2, -3);
scene.add(fill);

const ambLight = new THREE.AmbientLight(AMB_COLOR, AMB_INTENSITY);
scene.add(ambLight);

// IBL sky environment — lazy-inited on first realistic-mode activation
let _skyEnv = null;
let _pmrem  = null;

function getSkyEnv() {
  if (_skyEnv) return _skyEnv;
  _pmrem = _pmrem || new THREE.PMREMGenerator(renderer);
  _pmrem.compileEquirectangularShader();

  // 16×8 equirectangular gradient: sky-blue zenith → warm hazy horizon → warm ground nadir
  const W = 16, H = 8;
  const rows = [
    [95, 160, 215],  // zenith — deep sky blue
    [120,185,230],   // upper sky
    [155,210,240],   // mid sky
    [185,220,240],   // horizon sky
    [200,210,195],   // horizon haze
    [175,160,130],   // upper ground
    [140,125,100],   // mid ground
    [100, 88, 68],   // nadir
  ];
  const data = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) {
    const [r,g,b] = rows[y];
    for (let x = 0; x < W; x++) {
      const i = (y*W+x)*4;
      data[i]=r; data[i+1]=g; data[i+2]=b; data[i+3]=255;
    }
  }
  const equirect = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
  equirect.mapping = THREE.EquirectangularReflectionMapping;
  equirect.colorSpace = THREE.LinearSRGBColorSpace;
  equirect.needsUpdate = true;

  _skyEnv = _pmrem.fromEquirectangular(equirect).texture;
  equirect.dispose();
  return _skyEnv;
}

// Shadow floor + grid
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.18 });
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), shadowMat);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);
const grid = new THREE.GridHelper(6, 12, 0x334466, 0x223355);
scene.add(grid);

// Realistic ground material — lazy-built, same onBeforeCompile FBM approach as asset texture
let _groundMat = null;
function buildGroundMaterial() {
  if (_groundMat) return _groundMat;
  // Warm dirt/stone palette: dark soil → mid earth → sandy top
  const [p0,p1,p2,p3,p4,p5] = ['vec3(.10,.08,.05)','vec3(.25,.20,.13)','vec3(.42,.34,.22)','vec3(.56,.47,.32)','vec3(.68,.58,.42)','vec3(.78,.68,.52)'];

  const glsl = `
varying vec3 vWPos;
float _h3g(vec3 p){p=fract(p*vec3(443.897,397.297,491.187));p+=dot(p.zxy,p.yxz+19.19);return fract(p.x*p.y*p.z);}
float _n3g(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(_h3g(i),_h3g(i+vec3(1,0,0)),f.x),mix(_h3g(i+vec3(0,1,0)),_h3g(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(_h3g(i+vec3(0,0,1)),_h3g(i+vec3(1,0,1)),f.x),mix(_h3g(i+vec3(0,1,1)),_h3g(i+vec3(1,1,1)),f.x),f.y),f.z);}
float _fbmg(vec3 p){float v=0.,a=.5;for(int k=0;k<5;k++){v+=a*_n3g(p);a*=.5;p*=2.1;}return v;}
float _groundGray(vec3 wp){
  float n1=_fbmg(wp*1.4),n2=_fbmg(wp*1.4+vec3(1.5*n1,0.,0.8*n1));
  return clamp(n2*.8+_n3g(wp*8.)*.12+.08,0.,1.);
}
vec3 _groundPal(float t){
  t=clamp(t,0.,1.);
  if(t<.2) return mix(${p0},${p1},t*5.);
  if(t<.4) return mix(${p1},${p2},(t-.2)*5.);
  if(t<.6) return mix(${p2},${p3},(t-.4)*5.);
  if(t<.8) return mix(${p3},${p4},(t-.6)*5.);
  return mix(${p4},${p5},(t-.8)*5.);
}`;

  _groundMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0.0 });
  _groundMat.onBeforeCompile = shader => {
    shader.vertexShader = 'varying vec3 vWPos;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvWPos=(modelMatrix*vec4(position,1.)).xyz;'
    );
    shader.fragmentShader = glsl + '\n' + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <map_fragment>',
      '{diffuseColor.rgb*=_groundPal(_groundGray(vWPos));}'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <roughnessmap_fragment>',
      'float roughnessFactor=roughness*(.85+_n3g(vWPos*6.)*.15);'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <normal_fragment_maps>',
      `{float _e=0.04;
        float _gx=_groundGray(vWPos+vec3(_e,0,0))-_groundGray(vWPos-vec3(_e,0,0));
        float _gz=_groundGray(vWPos+vec3(0,0,_e))-_groundGray(vWPos-vec3(0,0,_e));
        vec3 _g=vec3(_gx,0.,_gz);
        normal=normalize(normal+0.18*(_g-dot(_g,normal)*normal));}`
    );
  };
  _groundMat.customProgramCacheKey = () => 'realistic-ground';
  return _groundMat;
}

// ── Asset loading ─────────────────────────────────────────────────────────────
let currentAssetObj = null;

function centreAsset(obj) {
  const box     = new THREE.Box3().setFromObject(obj);
  const boxCtr  = box.getCenter(new THREE.Vector3());
  const boxSize = box.getSize(new THREE.Vector3());
  const maxDim  = Math.max(boxSize.x, boxSize.y, boxSize.z);
  if (maxDim > 0.001) {
    const s = 2.0 / maxDim;
    obj.scale.setScalar(s);
    obj.position.sub(boxCtr.clone().multiplyScalar(s));
    obj.position.y += boxSize.y * s * 0.5;
  }
}

async function loadAsset(url) {
  try {
    // Cache-bust so re-import picks up the new file
    const mod = await import(url + '?t=' + Date.now());
    if (typeof mod.createAsset !== 'function') {
      console.error('createAsset not exported from', url);
      return null;
    }
    return mod.createAsset();
  } catch (e) {
    console.error('Failed to load asset:', e.message);
    return null;
  }
}

let renderStyle  = 'default';
let viewerStyle  = 'flat'; // 'flat' | 'smooth' | 'wire' | 'realistic'

async function fetchBrief() {
  try {
    const r = await fetch('/brief.json?t=' + Date.now());
    if (r.ok) {
      const b = await r.json();
      renderStyle = b.render_style || 'default';
      viewerStyle = renderStyle === 'low-poly' ? 'flat' : 'smooth';
    }
  } catch {}
}

// Build a clone of a geometry with smooth (position-averaged) normals.
// Works on both indexed and non-indexed geometries.
function buildSmoothGeo(geo) {
  const g = geo.clone();
  const pos = g.attributes.position;
  const n = pos.count;
  const accum = new Map();
  const key = (x, y, z) =>
    `${Math.round(x * 1e4)},${Math.round(y * 1e4)},${Math.round(z * 1e4)}`;
  const getIdx = g.index ? (t, e) => g.index.getX(t * 3 + e) : (t, e) => t * 3 + e;
  const nFaces = g.index ? Math.round(g.index.count / 3) : Math.floor(n / 3);
  for (let f = 0; f < nFaces; f++) {
    const i0=getIdx(f,0), i1=getIdx(f,1), i2=getIdx(f,2);
    const ax=pos.getX(i0), ay=pos.getY(i0), az=pos.getZ(i0);
    const bx=pos.getX(i1), by=pos.getY(i1), bz=pos.getZ(i1);
    const cx=pos.getX(i2), cy=pos.getY(i2), cz=pos.getZ(i2);
    const fnx=(by-ay)*(cz-az)-(bz-az)*(cy-ay);
    const fny=(bz-az)*(cx-ax)-(bx-ax)*(cz-az);
    const fnz=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
    for (const i of [i0, i1, i2]) {
      const k = key(pos.getX(i), pos.getY(i), pos.getZ(i));
      const a = accum.get(k) || [0,0,0];
      a[0]+=fnx; a[1]+=fny; a[2]+=fnz;
      accum.set(k, a);
    }
  }
  const nrm = g.attributes.normal;
  for (let i = 0; i < n; i++) {
    const k = key(pos.getX(i), pos.getY(i), pos.getZ(i));
    const [nx,ny,nz] = accum.get(k) || [0,1,0];
    const len = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
    nrm.setXYZ(i, nx/len, ny/len, nz/len);
  }
  nrm.needsUpdate = true;
  return g;
}

async function swapAsset(url) {
  const obj = await loadAsset(url);
  if (!obj) return;

  if (currentAssetObj) scene.remove(currentAssetObj);
  centreAsset(obj);
  obj.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      child._flatGeo   = child.geometry;
      child._smoothGeo = buildSmoothGeo(child.geometry);
    }
  });
  scene.add(obj);
  currentAssetObj = obj;
  applyStyle(viewerStyle);
}

// ── State / overlay ───────────────────────────────────────────────────────────
function set(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = cls || 'val';
}

// Mirror of threejs_loop.py::calculate_score — keeps HUD current even when loop_state is stale.
function calculateScore(metrics) {
  if (!metrics) return null;
  const geo = metrics.geometry || {};
  const shot = metrics.screenshot || {};
  const an  = metrics.screenshot_analysis || {};
  const va  = metrics.visual_analysis || {};
  if (!geo.ok) return 0;
  let s = 0.10;
  const tris = geo.triangle_count || 0;
  if (tris >= 200 && tris <= 2000) s += 0.20;
  else if (tris >= 50 && tris <= 8000) s += 0.10;
  else if (tris > 0) s += 0.02;
  if (geo.has_normals) s += 0.15;
  if (geo.has_uvs)     s += 0.15;
  if (shot.ok) {
    s += 0.10;
    const cov = an.coverage || 0;
    const div = an.color_diversity || 0;
    const uni = an.coverage_uniformity || 0;
    const rec = va.recognisable;
    const ref = va.reference_similarity;
    if (cov > 0.02) s += 0.05;
    if (rec === true || (rec == null && uni >= 0.70)) s += 0.10;
    if (div > 12) s += 0.10;
    if ((ref != null && ref >= 7) || cov > 0.10) s += 0.05;
  }
  const spike = geo.spike_ratio || 0;
  if (spike > 3.0) s -= 0.05;
  const se = geo.shared_edge_fraction != null ? geo.shared_edge_fraction : 1.0;
  if (se < 0.97) s -= 0.40;
  if ((an.dark_patch_fraction || 0) > 0.18 && va.normal_issues === true) s -= 0.05;
  return Math.round(Math.max(0, Math.min(1, s)) * 10000) / 10000;
}

async function fetchState() {
  try {
    const r = await fetch('/loop_state.json?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function fetchLatestMetrics(assetName, version) {
  try {
    // Find newest metrics file for this version
    const r = await fetch(`/metrics/?list=1&t=${Date.now()}`);
    // SimpleHTTPRequestHandler returns directory listing HTML — parse it
    const html = await r.text();
    const prefix = `${assetName}_${version}_`;
    const matches = [...html.matchAll(/href="([^"]*\.json)"/g)]
      .map(m => m[1])
      .filter(f => f.startsWith(prefix))
      .sort();
    if (!matches.length) return null;
    const latest = matches[matches.length - 1];
    const mr = await fetch(`/metrics/${latest}?t=` + Date.now());
    return await mr.json();
  } catch { return null; }
}

let lastVersion = null;
let currentAssetUrl = null;

// Initial load: prefer ?asset= query param, else use loop_state.json
const params  = new URLSearchParams(location.search);
let pinnedAsset = params.get('asset'); // cleared if file not found — falls back to loop state

async function init() {
  if (pinnedAsset) {
    currentAssetUrl = '/' + pinnedAsset;
    document.getElementById('asset-name').textContent = pinnedAsset;
    await swapAsset(currentAssetUrl);
    if (!currentAssetObj) pinnedAsset = null; // file missing — fall back to loop state
  }
  await pollState();
}

function parsePinned(path) {
  if (!path) return null;
  const dist = path.match(/^dist\/(.+)\.mjs$/);
  if (dist) return { name: dist[1], version: 'dist' };
  const cand = path.match(/^candidates\/(.+)_(v\d+)\.mjs$/);
  if (cand) return { name: cand[1], version: cand[2] };
  return null;
}

async function pollState() {
  const state = await fetchState();
  if (!state) {
    if (!pinnedAsset) document.getElementById('asset-name').textContent = 'no loop_state.json found';
    return;
  }

  const loopVersion = state.current_version || state.best_version || 'v1';
  const loopName    = state.asset_name || 'unknown';

  // When a specific candidate is pinned, show ITS data — not the loop's current best
  const pinned  = parsePinned(pinnedAsset);
  const dispName    = pinned ? pinned.name    : loopName;
  const dispVersion = pinned ? pinned.version : loopVersion;

  // Score: look up pinned version in history; fall back to loop best for dist/unpinned
  let dispScore = state.best_score;
  if (pinned && pinned.version !== 'dist') {
    const entry = (state.history || []).find(h => h.version === pinned.version);
    dispScore = entry ? entry.score : null;
  }

  set('s-asset',   dispName);
  set('s-version', dispVersion);
  set('s-iter',    `${state.iteration} / 30`);
  set('s-score',   dispScore != null ? dispScore.toFixed(3) : '—');

  const scoreEl = document.getElementById('s-score');
  const bs = dispScore || 0;
  scoreEl.className = bs >= PASS_THRESHOLD ? 'pass' : bs >= 0.80 ? 'warn' : 'fail';

  const status = state.done ? 'DONE ✓' : `iterating (trust ${(state.trust_score || 50).toFixed(0)}/100)`;
  set('s-status', status, state.done ? 'pass' : 'val');

  if (!pinnedAsset) {
    document.getElementById('asset-name').textContent =
      `${loopName} — ${loopVersion}  (iter ${state.iteration})`;
  }

  // Fetch metrics for the DISPLAYED version, not necessarily the loop's current version
  const metricsVersion = pinned && pinned.version !== 'dist' ? pinned.version : loopVersion;
  const metricsName    = dispName;
  const metrics = await fetchLatestMetrics(metricsName, metricsVersion);
  if (metrics) {
    const geo = metrics.geometry || {};
    const an  = metrics.screenshot_analysis || {};
    set('s-tris',    geo.triangle_count ?? '—');
    set('s-normals', geo.has_normals ? 'yes' : 'NO', geo.has_normals ? 'pass' : 'fail');
    set('s-uvs',     geo.has_uvs ? 'yes' : 'NO',     geo.has_uvs ? 'pass' : 'fail');
    const cov = an.coverage != null ? (an.coverage * 100).toFixed(1) + '%' : '—';
    set('s-cov', cov);
    // Recalculate score live from metrics — overrides stale loop_state score
    const liveScore = calculateScore(metrics);
    if (liveScore != null) {
      dispScore = liveScore;
      set('s-score', liveScore.toFixed(3));
      const scoreEl = document.getElementById('s-score');
      scoreEl.className = liveScore >= PASS_THRESHOLD ? 'pass' : liveScore >= 0.80 ? 'warn' : 'fail';
    }
  }

  // Swap asset only when not pinned and loop version changed
  const loopUrl = `/candidates/${loopName}_${loopVersion}.mjs`;
  if (!pinnedAsset && loopVersion !== lastVersion) {
    lastVersion = loopVersion;
    currentAssetUrl = loopUrl;
    await swapAsset(loopUrl);
    const flash = document.getElementById('reload-flash');
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 1800);
  }
}

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── Render loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Style switcher ────────────────────────────────────────────────────────────

function getCurrentAssetName() {
  const p = parsePinned(pinnedAsset);
  if (p) return p.name;
  let m = (currentAssetUrl || '').match(/\/candidates\/([^_]+)_v\d+\.mjs/);
  if (m) return m[1];
  m = (currentAssetUrl || '').match(/\/dist\/(.+)\.mjs/);
  return m ? m[1] : 'unknown';
}

// GLSL world-position procedural material — no UV seam, asset-type-aware.
// onBeforeCompile injects FBM noise into the MeshStandardMaterial PBR shader,
// sampling world position (3D) instead of UV so the back-of-sphere seam never appears.
// Cached per type so the shader compiles only once.
const _realisticMats = {};

function buildRealisticMaterial(assetName, meshName = '') {
  const m = (meshName || '').toLowerCase();
  const t = (assetName || '').toLowerCase();
  let type;
  if      (/foliage|leaf|leaves|canopy|frond/.test(m)) type = 'foliage';
  else if (/^tip$/.test(m))                            type = 'tip';
  else if (/^crown$/.test(m))                          type = 'crown';
  else if (/trunk|bark|branch|stem|wood/.test(m))      type = 'bark';
  else if (/rock|stone|boulder|gravel|pebble/.test(t)) type = 'granite';
  else if (/tree|wood|log|bark|branch/.test(t))        type = 'bark';
  else if (/metal|barrel|iron|steel|ore|coin|armou?r/.test(t)) type = 'metal';
  else if (/banana|fruit|citrus|mango|apple|orange/.test(t))   type = 'banana';
  else                                                  type = 'stone';

  if (_realisticMats[type]) return _realisticMats[type];

  const cfgs = {
    granite: { pal: ['vec3(.150,.125,.094)','vec3(.306,.267,.216)','vec3(.541,.478,.408)','vec3(.659,.596,.518)','vec3(.765,.714,.643)','vec3(.867,.827,.773)'], ax:1.00,ay:1.00,az:1.00, sc:3.5, rough:0.88, metal:0.02, bStr:0.50 },
    bark:    { pal: ['vec3(.090,.055,.025)','vec3(.220,.130,.060)','vec3(.380,.240,.120)','vec3(.520,.340,.175)','vec3(.620,.440,.225)','vec3(.720,.540,.285)'], ax:0.25,ay:2.50,az:0.25, sc:4.0, rough:0.92, metal:0.02, bStr:0.60 },
    foliage: { pal: ['vec3(.040,.095,.014)','vec3(.110,.210,.042)','vec3(.210,.350,.082)','vec3(.295,.430,.112)','vec3(.360,.500,.140)','vec3(.430,.580,.172)'], ax:2.20,ay:0.70,az:2.20, sc:11.0, rough:0.88, metal:0.00, bStr:0.18 },
    metal:   { pal: ['vec3(.140,.130,.130)','vec3(.280,.260,.250)','vec3(.440,.420,.400)','vec3(.580,.560,.530)','vec3(.700,.680,.650)','vec3(.820,.800,.770)'], ax:1.00,ay:1.00,az:1.00, sc:2.0, rough:0.30, metal:0.72, bStr:0.12 },
    stone:   { pal: ['vec3(.180,.160,.140)','vec3(.350,.320,.280)','vec3(.520,.480,.430)','vec3(.640,.600,.540)','vec3(.740,.700,.640)','vec3(.840,.810,.750)'], ax:1.00,ay:1.00,az:1.00, sc:3.0, rough:0.85, metal:0.02, bStr:0.42 },
    banana:  { pal: ['vec3(.72,.60,.04)','vec3(.82,.70,.05)','vec3(.92,.82,.06)','vec3(1.0,.90,.05)','vec3(1.0,.94,.12)','vec3(1.0,.98,.22)'], ax:1.00,ay:0.80,az:1.00, sc:4.0, rough:0.40, metal:0.01, bStr:0.05 },
    tip:     { pal: ['vec3(.10,.05,.01)','vec3(.22,.11,.04)','vec3(.33,.17,.06)','vec3(.42,.22,.08)','vec3(.50,.27,.10)','vec3(.56,.30,.12)'], ax:2.0,ay:2.0,az:2.0, sc:8.0, rough:0.88, metal:0.01, bStr:0.20 },
    crown:   { pal: ['vec3(.18,.09,.03)','vec3(.25,.16,.05)','vec3(.22,.28,.08)','vec3(.30,.38,.12)','vec3(.37,.46,.16)','vec3(.42,.50,.18)'], ax:2.0,ay:2.0,az:2.0, sc:5.0, rough:0.82, metal:0.01, bStr:0.28 },
  };
  const cfg = cfgs[type];
  const [p0,p1,p2,p3,p4,p5] = cfg.pal;
  const sc    = cfg.sc.toFixed(1);
  const scHi  = (cfg.sc * 4.8).toFixed(1);
  const scRgh = (cfg.sc * 2.2).toFixed(1);
  const bStr  = cfg.bStr.toFixed(2);

  // GLSL injected into fragment shader preamble — world-pos FBM + bump via 3D gradient
  const glsl = `
varying vec3 vWPos;
float _h3(vec3 p){p=fract(p*vec3(443.897,397.297,491.187));p+=dot(p.zxy,p.yxz+19.19);return fract(p.x*p.y*p.z);}
float _n3(vec3 p){
  vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(_h3(i),_h3(i+vec3(1,0,0)),f.x),mix(_h3(i+vec3(0,1,0)),_h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(_h3(i+vec3(0,0,1)),_h3(i+vec3(1,0,1)),f.x),mix(_h3(i+vec3(0,1,1)),_h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float _fbm(vec3 p){float v=0.,a=.5;for(int k=0;k<7;k++){v+=a*_n3(p);a*=.5;p*=2.07;}return v;}
vec3 _pal(float t){
  t=clamp(t,0.,1.);
  if(t<.2) return mix(${p0},${p1},t*5.);
  if(t<.4) return mix(${p1},${p2},(t-.2)*5.);
  if(t<.6) return mix(${p2},${p3},(t-.4)*5.);
  if(t<.8) return mix(${p3},${p4},(t-.6)*5.);
  return mix(${p4},${p5},(t-.8)*5.);
}
// Scalar version of the noise field — used by bump gradient
float _gray(vec3 wp){
  vec3 p=wp*vec3(${cfg.ax.toFixed(2)},${cfg.ay.toFixed(2)},${cfg.az.toFixed(2)})*${sc};
  float n1=_fbm(p), n2=_fbm(p+vec3(1.7*n1,0.9*n1,0.3*n1));
  return clamp(n2*.82+_n3(wp*${scHi})*.12+.06,0.,1.);
}
vec3 assetTex(vec3 wp){ return _pal(_gray(wp)); }`;

  // Crown: vertex colors (per-face hash from stemPal) for multi-toned faceted look.
  // Banana: smooth world-space colour computed in GLSL — no vertex colours so no triangle edges.
  // Others: FBM palette via map_fragment.
  const mat = new THREE.MeshStandardMaterial({
    roughness: cfg.rough, metalness: cfg.metal, flatShading: false,
    ...(type === 'crown' ? { vertexColors: true } : {}),
  });

  mat.onBeforeCompile = shader => {
    // Vertex: pass world position to fragment
    shader.vertexShader = 'varying vec3 vWPos;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvWPos=(modelMatrix*vec4(position,1.)).xyz;'
    );
    // Fragment: inject noise/palette helpers + replace map/roughness/normal chunks
    shader.fragmentShader = glsl + '\n' + shader.fragmentShader;
    let mapFrag;
    if (type === 'banana') {
      // Smooth bright yellow — world x drives the stem→yellow green fade.
      // No vertex colours used so zero triangle-edge artefacts; PBR does all shading.
      // vWPos.x after centreAsset: bounding box -1..+1 but banana tube starts at
      // world x≈-0.78 (stem) and ends at ≈+0.92 (tips), range ≈1.70.
      // Normalise relative to tube endpoints so _xn=0 at stem, 1 at tips.
      mapFrag = `{
        vec3 _yel=vec3(1.00,0.93,0.10);
        float _xn=clamp((vWPos.x+0.78)/1.70,0.0,1.0);
        float _gb=max(0.0,1.0-_xn/0.20);
        vec3 _grn=vec3(0.24,0.40,0.10);
        diffuseColor.rgb=mix(_yel,_grn,_gb);
      }`;
    } else if (type === 'crown') {
      mapFrag = '{}'; // vertex colours applied by color_fragment
    } else {
      mapFrag = '{diffuseColor.rgb*=assetTex(vWPos);}';
    }
    shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', mapFrag);
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <roughnessmap_fragment>',
      `float roughnessFactor=roughness*(.72+_n3(vWPos*${scRgh})*.32);`
    );
    // Bump: 3D FBM gradient via 6-sample finite differences in world space.
    // Project gradient onto tangent plane (subtract normal component) then blend.
    // eps=0.018 gives ~0.063 texture-space step at sc=3.5 — captures FBM mid-frequency detail.
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <normal_fragment_maps>',
      `{float _e=0.018;
        float _gx=_gray(vWPos+vec3(_e,0,0))-_gray(vWPos-vec3(_e,0,0));
        float _gy=_gray(vWPos+vec3(0,_e,0))-_gray(vWPos-vec3(0,_e,0));
        float _gz=_gray(vWPos+vec3(0,0,_e))-_gray(vWPos-vec3(0,0,_e));
        vec3 _g=vec3(_gx,_gy,_gz);
        normal=normalize(normal+${bStr}*(_g-dot(_g,normal)*normal));}`
    );
  };
  mat.customProgramCacheKey = () => `realistic-${type}`;
  _realisticMats[type] = mat;
  return mat;
}

const _origMats = new WeakMap();

function applyStyle(style) {
  viewerStyle = style;

  if (currentAssetObj) {
    const assetName = getCurrentAssetName();
    currentAssetObj.traverse(child => {
      if (!child.isMesh) return;

      // Swap to smooth geometry for Smooth/Realistic, flat geometry for Flat/Wire
      const useSmooth = style === 'smooth' || style === 'realistic';
      if (useSmooth && child._smoothGeo) child.geometry = child._smoothGeo;
      else if (!useSmooth && child._flatGeo) child.geometry = child._flatGeo;

      if (style === 'realistic') {
        if (!_origMats.has(child)) _origMats.set(child, child.material);
        child.material = buildRealisticMaterial(assetName, child.name);
      } else {
        if (_origMats.has(child)) child.material = _origMats.get(child);
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => {
          m.wireframe   = style === 'wire';
          m.flatShading = false; // normals already match the mode via geometry swap
          m.needsUpdate = true;
        });
      }
    });
  }

  if (style === 'realistic') {
    sun.color.set(0xfff8f0);  sun.intensity      = 1.6;
    fill.color.set(0x88aacc); fill.intensity     = 0.40;
    ambLight.color.set(0xaabccc); ambLight.intensity = 0.20;
    scene.environment    = getSkyEnv();
    scene.background     = new THREE.Color(0x8fa0af);
    floorMesh.material   = buildGroundMaterial();
    floorMesh.receiveShadow = true;
    grid.visible         = false;
  } else {
    sun.color.set(SUN_COLOR);  sun.intensity      = SUN_INTENSITY;
    fill.color.set(FILL_COLOR); fill.intensity    = FILL_INTENSITY;
    ambLight.color.set(AMB_COLOR); ambLight.intensity = AMB_INTENSITY;
    scene.environment    = null;
    scene.background     = new THREE.Color(BG_COLOR);
    floorMesh.material   = shadowMat;
    grid.visible         = true;
  }

  renderStyleBar();
}

function renderStyleBar() {
  const bar = document.getElementById('style-bar');
  bar.textContent = '';
  for (const {id, label} of [{id:'flat',label:'Flat'},{id:'smooth',label:'Smooth'},{id:'wire',label:'Wire'},{id:'realistic',label:'Realistic'}]) {
    const btn = document.createElement('button');
    btn.className = 'st-btn' + (viewerStyle === id ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => applyStyle(id));
    bar.appendChild(btn);
  }
}

// ── Asset switcher ────────────────────────────────────────────────────────────
async function fetchAssets() {
  try {
    const r = await fetch('/api/assets?t=' + Date.now());
    return r.ok ? await r.json() : [];
  } catch { return []; }
}

function renderSwitcher(assets) {
  const el = document.getElementById('switcher');
  if (!assets.length) { el.style.display = 'none'; return; }
  el.style.display = '';

  const groups = {};
  for (const a of assets) {
    if (!groups[a.name]) groups[a.name] = [];
    groups[a.name].push(a);
  }

  el.textContent = '';
  for (const [name, items] of Object.entries(groups)) {
    const group = document.createElement('div');
    group.className = 'sw-group';

    const label = document.createElement('div');
    label.className = 'sw-name';
    label.textContent = name;
    group.appendChild(label);

    const row = document.createElement('div');
    row.className = 'sw-versions';

    for (const a of items) {
      const isActive = ('/' + a.path) === currentAssetUrl;
      const btn = document.createElement('button');
      btn.className = 'sw-btn' + (a.type === 'dist' ? ' dist' : '') + (isActive ? ' active' : '');
      btn.textContent = a.version;
      btn.addEventListener('click', async () => {
        pinnedAsset = a.path;
        currentAssetUrl = '/' + a.path;
        document.getElementById('asset-name').textContent = a.path;
        await swapAsset(currentAssetUrl);
        renderSwitcher(assets);
        await pollState();
      });
      row.appendChild(btn);
    }
    group.appendChild(row);
    el.appendChild(group);
  }
}

let cachedAssets = [];
async function refreshSwitcher() {
  cachedAssets = await fetchAssets();
  renderSwitcher(cachedAssets);
}

// ── Poll for updates ──────────────────────────────────────────────────────────
await fetchBrief();
await init();
renderStyleBar();
await refreshSwitcher();
setInterval(pollState, 3000);
setInterval(refreshSwitcher, 5000);
</script>
